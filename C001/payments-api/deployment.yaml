apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: c001
  name: "c001"
  labels:
    app: "payments-api"
    team: "C001"
    employee-id: "10001"
    framework: "Quarkus"
    managed-by: "platform-engineering"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: "payments-api"
  template:
    metadata:
      labels:
        app: "payments-api"
        team: "C001"
        employee-id: "10001"
        framework: "Quarkus"
        managed-by: "platform-engineering"
    spec:
      containers:
        - name: payments-api
          image: guopingjia/mario:cfe-demo
          ports:
            - containerPort: 80
              protocol: TCP
