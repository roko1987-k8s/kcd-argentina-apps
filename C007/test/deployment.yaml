apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: C007
  name: "c007"
  labels:
    app: "test"
    team: "C007"
    employee-id: "10007"
    framework: "Quarkus"
    managed-by: "platform-engineering"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: "test"
  template:
    metadata:
      labels:
        app: "test"
        team: "C007"
        employee-id: "10007"
        framework: "Quarkus"
        managed-by: "platform-engineering"
    spec:
      containers:
        - name: test
          image: guopingjia/mario:cfe-demo
          ports:
            - containerPort: 80
              protocol: TCP
